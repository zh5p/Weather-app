<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Weather Dashboard 🌤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="weather-container">
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Riyadh)...">
      <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div id="weatherResult" class="weather-display">
      <div class="welcome-msg">
        <i class="fa-solid fa-cloud-sun fa-3x"></i>
        <p>Search for any city to check weather details</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
